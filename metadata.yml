Interpretation: Two rank scores calibrated against the Ersilia reference library
  of 50K compounds, where 0.65 beats 99% of it. The first is how likely 
  Escherichia coli is to pump the compound out; the second how likely it is to 
  inhibit growth only when efflux is disabled. Trained on a tolC-mutant screen.
