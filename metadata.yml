Title: Efflux susceptibility in gram-negative bacteria
Description: Flags small molecules likely to be expelled by Escherichia coli 
  efflux pumps, the barrier that most often strips Gram-negative antibacterials 
  of whole-cell activity. El Zahed and colleagues screened some 314,000 
  compounds against an efflux-deficient tolC mutant and separated roughly 1,070 
  pumped from 410 non-pumped actives. Ersilia trained two LazyQSAR classifiers, 
  pumped against non-pumped actives (1,465 compounds) and tolC-only inhibitors 
  against a random sample of inactives (37,470 compounds, 10% active), both with
  a five-fold out-of-fold AUROC of 0.92.
