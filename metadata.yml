Title: Efflux susceptibility in gram-negative bacteria
Description: Flags small molecules likely to be expelled by Escherichia coli efflux
  pumps, the barrier that most often strips Gram-negative antibacterials of whole-cell
  activity. El Zahed and colleagues screened some 314,000 compounds against an efflux-deficient
  tolC mutant, recovered about 4,500 growth inhibitors, 84% of which lost potency
  in the wild type, and separated roughly 1,070 pumped from 410 non-pumped actives.
  Ersilia retrained classifiers on those sets with LazyQSAR instead of serving the
  published SERF random forest.
